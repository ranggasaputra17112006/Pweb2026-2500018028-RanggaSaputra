<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contoh Superscript dan Subscript</title>
</head>
<body>

    <h1>Contoh Superscript dan Subscript</h1>

    <h2>Rumus Matematika</h2>
    <p>
        (a + b)<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> + 2ab
    </p>

    <p>
        x<sub>1</sub> + x<sub>2</sub> = -b / a
    </p>

    <h2>Rumus Kimia</h2>
    <p>
        H<sub>2</sub> + Cl<sub>2</sub> = 2HCl
    </p>

    <p>
        CO<sub>2</sub> + H<sub>2</sub>O → H<sub>2</sub>CO<sub>3</sub>
    </p>

</body>
</html>
